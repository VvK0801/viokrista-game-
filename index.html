<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Случайный попутчик</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; width:100%;
    background:#000;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#2b2b3a;
    overflow:hidden;
    user-select:none;
  }
  #game {
    position:relative;
    width:100%; height:100%;
    max-width:480px;
    margin:0 auto;
    background:linear-gradient(180deg,#fff5ec 0%, #ffe8d6 50%, #ffd9c0 100%);
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* Декоративные сердечки на фоне */
  .heart {
    position:absolute;
    color:rgba(255,120,150,0.15);
    font-size:24px;
    animation: float 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes float {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50% { transform:translateY(-20px) rotate(10deg); }
  }

  /* Верхняя панель — как счётчик искры */
  #topBar {
    position:relative; z-index:5;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,180,180,0.3);
    font-size:13px;
  }
  #stageName { color:#8a6a7a; font-weight:600; }
  #sparkWrap { display:flex; align-items:center; gap:8px; }
  #sparkHearts { font-size:16px; letter-spacing:2px; }

  /* Чат */
  #chat {
    position:relative; z-index:4;
    flex:1;
    overflow-y:auto;
    padding:18px 14px 10px;
    display:flex; flex-direction:column; gap:10px;
    scroll-behavior:smooth;
  }
  #chat::-webkit-scrollbar { width:0; }

  .msg {
    max-width:82%;
    padding:11px 15px;
    border-radius:18px;
    font-size:15px;
    line-height:1.45;
    animation:pop 0.35s ease-out;
    word-wrap:break-word;
  }
  @keyframes pop {
    from { opacity:0; transform:translateY(12px) scale(0.96); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  .msg.left {
    align-self:flex-start;
    background:#ffffff;
    color:#2b2b3a;
    border-bottom-left-radius:4px;
    box-shadow:0 2px 8px rgba(200,150,150,0.15);
  }
  .msg.right {
    align-self:flex-end;
    background:linear-gradient(135deg,#ff8fa8,#ff6b8a);
    color:#fff;
    border-bottom-right-radius:4px;
    box-shadow:0 2px 8px rgba(255,100,130,0.3);
  }
  .msg.sys {
    align-self:center;
    background:rgba(255,255,255,0.6);
    color:#8a6a7a;
    font-size:12.5px;
    font-style:italic;
    text-align:center;
    max-width:95%;
    padding:8px 14px;
  }

  /* Панель кнопок */
  #choices {
    position:relative; z-index:6;
    padding:12px 14px 22px;
    display:flex; flex-direction:column; gap:8px;
    background:linear-gradient(180deg, transparent, rgba(255,240,235,0.95) 30%);
    min-height:60px;
  }
  .btn {
    padding:13px 16px;
    border-radius:16px;
    border:1.5px solid rgba(255,140,170,0.4);
    background:rgba(255,255,255,0.9);
    color:#5a3a4a;
    font-size:15px;
    cursor:pointer;
    transition:all 0.2s;
    text-align:center;
    font-weight:500;
  }
  .btn:active {
    background:rgba(255,200,215,0.95);
    transform:scale(0.98);
  }
  .btn.primary {
    background:linear-gradient(135deg,#ff8fa8,#ff6b8a);
    color:#fff;
    border-color:transparent;
    box-shadow:0 4px 12px rgba(255,100,130,0.3);
  }
  .btn.primary:active { transform:scale(0.97); }

  .tapHint {
    align-self:center;
    color:#b090a0;
    font-size:12px;
    margin-top:4px;
    animation:pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:0.4; }
    50% { opacity:1; }
  }

  /* Экран финала */
  #endScreen {
    position:absolute; inset:0;
    background:linear-gradient(180deg,#fff5ec,#ffe0d0);
    z-index:20;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
    gap:18px;
    overflow-y:auto;
  }
  #endScreen.show { display:flex; animation:pop 0.6s; }
  #endEmoji { font-size:64px; }
  #endTitle { font-size:24px; font-weight:700; color:#5a3a4a; }
  #endText { font-size:15px; color:#8a6a7a; line-height:1.6; max-width:340px; }
  #album {
    display:flex; gap:10px; margin:10px 0;
    font-size:34px;
  }
  #album span { animation:pop 0.5s backwards; }
  #album span:nth-child(1) { animation-delay:0.1s; }
  #album span:nth-child(2) { animation-delay:0.3s; }
  #album span:nth-child(3) { animation-delay:0.5s; }
  #album span:nth-child(4) { animation-delay:0.7s; }
  #restart {
    margin-top:10px;
    padding:14px 32px;
    border-radius:30px;
    background:linear-gradient(135deg,#ff8fa8,#ff6b8a);
    border:none;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(255,100,130,0.4);
  }
</style>
</head>
<body>
<div id="game">
  <div id="topBar">
    <div id="stageName">🚂 Поезд «Москва — Казань»</div>
    <div id="sparkWrap">
      <span id="sparkHearts">♡♡♡♡♡</span>
    </div>
  </div>

  <div id="chat"></div>
  <div id="choices"></div>

  <div id="endScreen">
    <div id="endEmoji"></div>
    <div id="endTitle"></div>
    <div id="endText"></div>
    <div id="album"></div>
    <button id="restart">Прожить ещё раз</button>
  </div>
</div>

<script>
/* ================== СОСТОЯНИЕ ================== */
const S = {
  spark: 0,      // уровень искры (0..5)
  stage: 0,
  choicesMade: 0
};

const chat = document.getElementById('chat');
const choicesEl = document.getElementById('choices');
const sparkHearts = document.getElementById('sparkHearts');
const endScreen = document.getElementById('endScreen');
const endEmoji = document.getElementById('endEmoji');
const endTitle = document.getElementById('endTitle');
const endText = document.getElementById('endText');
const album = document.getElementById('album');

/* ================== ФОН ================== */
function spawnHearts() {
  const emojis = ['♡','♥','✿','❀','♡'];
  for (let i = 0; i < 8; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = emojis[i % emojis.length];
    h.style.left = (Math.random() * 90 + 5) + '%';
    h.style.top = (Math.random() * 80 + 5) + '%';
    h.style.animationDelay = (Math.random() * 6) + 's';
    h.style.fontSize = (18 + Math.random() * 20) + 'px';
    document.getElementById('game').appendChild(h);
  }
}

/* ================== УТИЛИТЫ ================== */
function updateSpark() {
  let s = '';
  for (let i = 0; i < 5; i++) s += i < S.spark ? '❤' : '♡';
  sparkHearts.textContent = s;
  sparkHearts.style.color = S.spark >= 4 ? '#ff4a7a' : '#c090a0';
}

function addMsg(text, side = 'left') {
  const d = document.createElement('div');
  d.className = 'msg ' + side;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addSys(text) {
  const d = document.createElement('div');
  d.className = 'msg sys';
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function clearChoices() { choicesEl.innerHTML = ''; }

function makeChoice(label, action, isPrimary=false, spark=0) {
  const b = document.createElement('button');
  b.className = 'btn' + (isPrimary ? ' primary' : '');
  b.textContent = label;
  b.onclick = () => {
    clearChoices();
    if (spark) { S.spark = Math.min(5, S.spark + spark); updateSpark(); }
    action();
  };
  choicesEl.appendChild(b);
}

function waitTap(cb) {
  const hint = document.createElement('div');
  hint.className = 'tapHint';
  hint.textContent = 'нажми, чтобы продолжить';
  choicesEl.appendChild(hint);
  const handler = (e) => {
    e.preventDefault();
    choicesEl.removeEventListener('touchstart', handler);
    choicesEl.removeEventListener('click', handler);
    clearChoices();
    cb();
  };
  choicesEl.addEventListener('touchstart', handler, {once:true});
  choicesEl.addEventListener('click', handler, {once:true});
}

/* ================== СЦЕНАРИЙ ================== */

function start() {
  S.spark = 0; S.stage = 0;
  chat.innerHTML = '';
  endScreen.classList.remove('show');
  updateSpark();

  addSys('Вокзал. Ты опаздываешь на поезд.');
  addSys('Последний вагон. Двери почти закрываются.');

  setTimeout(() => {
    addSys('Ты вбегаешь. Мест нет. Только одно — рядом с человеком у окна.');
    setTimeout(scene1, 900);
  }, 800);
}

function scene1() {
  addMsg('Человек у окна смотрит на тебя. Молча подвигается.', 'sys');
  addMsg('Проходите. Я не кусаюсь.', 'left');

  makeChoice('«Спасибо. Вы меня спасли.»', () => {
    addMsg('Спасибо. Вы меня спасли.', 'right');
    S.spark++; updateSpark();
    setTimeout(() => {
      addMsg('Да ладно. Просто место было.', 'left');
      addMsg('Вы тоже не любите жару?', 'left');
      setTimeout(scene2, 1200);
    }, 800);
  }, true, 1);

  makeChoice('Молча сесть и смотреть в окно', () => {
    addMsg('…', 'right');
    setTimeout(() => {
      addMsg('Тяжёлый день?', 'left');
      setTimeout(scene2, 1000);
    }, 900);
  });

  makeChoice('«Я на минуту, потом уйду.»', () => {
    addMsg('Я на минуту, потом уйду.', 'right');
    S.spark--; updateSpark();
    setTimeout(() => {
      addMsg('Как хотите.', 'left');
      setTimeout(scene2, 1000);
    }, 900);
  });
}

function scene2() {
  addSys('Поезд тронулся. За окном мелькают поля.');
  addMsg('Кстати, меня зовут Саша.', 'left');

  makeChoice('Назвать своё имя и улыбнуться', () => {
    addMsg('Очень приятно. Я — (твоё имя).', 'right');
    S.spark++; updateSpark();
    setTimeout(() => {
      addMsg('Красивое имя. Редкое.', 'left');
      setTimeout(scene3, 1200);
    }, 900);
  }, true, 1);

  makeChoice('«А зачем вам моё имя?»', () => {
    addMsg('А зачем вам моё имя?', 'right');
    setTimeout(() => {
      addMsg('Чтобы знать, кому я уступаю место.', 'left');
      addMsg('И кого потом вспоминать.', 'left');
      S.spark++; updateSpark();
      setTimeout(scene3, 1400);
    }, 900);
  });

  makeChoice('Промолчать', () => {
    addMsg('…', 'right');
    setTimeout(() => {
      addMsg('Ладно. Бывает.', 'left');
      setTimeout(scene3, 900);
    }, 900);
  });
}

function scene3() {
  addSys('Проходит час. Вы говорите обо всём.');
  addMsg('Знаете, я обычно не разговариваю с попутчиками.', 'left');
  addMsg('Но с вами почему-то хочется.', 'left');

  makeChoice('«Мне тоже. Это странно, да?»', () => {
    addMsg('Мне тоже. Это странно, да?', 'right');
    S.spark++; updateSpark();
    setTimeout(() => {
      addMsg('Не странно. Судьба.', 'left');
      setTimeout(scene4, 1200);
    }, 900);
  }, true, 1);

  makeChoice('«Просто вежливость.»', () => {
    addMsg('Просто вежливость.', 'right');
    S.spark--; updateSpark();
    setTimeout(() => {
      addMsg('Может быть.', 'left');
      addMsg('Хотя я в вежливость не верю.', 'left');
      setTimeout(scene4, 1200);
    }, 900);
  });

  makeChoice('Рассказать о себе что-то личное', () => {
    addMsg('Знаете, я еду к бабушке. Она болеет.', 'right');
    S.spark += 2; updateSpark();
    setTimeout(() => {
      addMsg('Простите. Я… не знал.', 'left');
      addMsg('Хотите, я с вами выйду? Провожу.', 'left');
      setTimeout(scene4, 1400);
    }, 900);
  }, false, 2);
}

function scene4() {
  addSys('Поезд подъезжает к станции.');
  addMsg('Мне выходить через две остановки.', 'left');
  addMsg('Может… обменяемся номерами?', 'left');

  makeChoice('«Да. Я хочу вас увидеть снова.»', () => {
    addMsg('Да. Я хочу вас увидеть снова.', 'right');
    S.spark++; updateSpark();
    setTimeout(() => {
      addMsg('Тогда до встречи. Обязательно.', 'left');
      setTimeout(scene5, 1200);
    }, 900);
  }, true, 1);

  makeChoice('«Давайте. Но просто как друзья.»', () => {
    addMsg('Давайте. Но просто как друзья.', 'right');
    setTimeout(() => {
      addMsg('Хорошо. Друзья — это тоже начало.', 'left');
      setTimeout(scene5, 1200);
    }, 900);
  });

  makeChoice('«Не думаю, что это нужно.»', () => {
    addMsg('Не думаю, что это нужно.', 'right');
    S.spark--; updateSpark();
    setTimeout(() => {
      addMsg('Понимаю. Тогда… удачи вам.', 'left');
      setTimeout(scene5, 1200);
    }, 900);
  });
}

function scene5() {
  addSys('Проходит год. Потом второй.');
  addSys('Вы переписываетесь. Встречаетесь. Влюбляетесь.');

  setTimeout(() => {
    addMsg('Я хочу тебе кое-что сказать.', 'left');
    addMsg('Помнишь тот поезд?', 'left');
    addMsg('Я тогда понял, что не хочу, чтобы ты выходил(а).', 'left');
    addMsg('Выходи за меня. Или дай мне выйти за тебя.', 'left');

    makeChoice('«Да. Тысячу раз да.»', () => {
      addMsg('Да. Тысячу раз да.', 'right');
      S.spark++; updateSpark();
      setTimeout(finish, 1000);
    }, true, 1);

    makeChoice('«Давай просто будем вместе.»', () => {
      addMsg('Давай просто будем вместе.', 'right');
      setTimeout(finish, 1000);
    });

  }, 1200);
}

function finish() {
  let emoji, title, text, photos;

  if (S.spark >= 4) {
    emoji = '💍';
    title = 'Семья';
    text = 'Через год — свадьба. Через три — первый ребёнок. Через тридцать — внуки на коленях. Вы до сих пор ездите в поездах и уступаете друг другу место.';
    photos = ['👰','🤵','👶','👨‍👩‍👧','🏡'];
  } else if (S.spark >= 2) {
    emoji = '🌷';
    title = 'Долгая дорога';
    text = 'Вы не поженились сразу. Но остались рядом. И однажды, спустя много лет, поняли, что уже семья — без всяких штампов.';
    photos = ['🚂','💌','🌹','💒'];
  } else if (S.spark >= 0) {
    emoji = '📮';
    title = 'Контакт в телефоне';
    text = 'Вы обменялись номерами. Переписывались месяц. Потом реже. Потом совсем перестали. Но иногда ты видишь её/его имя в контактах — и улыбаешься.';
    photos = ['📱','💬','🌙'];
  } else {
    emoji = '🌫️';
    title = 'Просто попутчик';
    text = 'Вы вышли на разных станциях. И больше никогда не встретились. Но иногда, в поезде, ты смотришь в окно и вспоминаешь того человека у окна.';
    photos = ['🚂','🌫️','🕰️'];
  }

  endEmoji.textContent = emoji;
  endTitle.textContent = title;
  endText.textContent = text;
  album.innerHTML = '';
  photos.forEach((p, i) => {
    const s = document.createElement('span');
    s.textContent = p;
    s.style.animationDelay = (i * 0.2) + 's';
    album.appendChild(s);
  });
  endScreen.classList.add('show');
}

/* ================== ЗАПУСК ================== */
document.getElementById('restart').onclick = start;
spawnHearts();
start();
</script>
</body>
</html>
