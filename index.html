<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Попутчик</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; width:100%;
    background:#000;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#e8e8e8;
    overflow:hidden;
    user-select:none;
  }
  #game {
    position:relative;
    width:100%; height:100%;
    max-width:480px;
    margin:0 auto;
    background:linear-gradient(180deg,#0a0a12 0%, #12121c 100%);
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* Фон поезда */
  #trainBg {
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 30%, rgba(80,60,120,0.25), transparent 60%),
      repeating-linear-gradient(90deg, transparent 0 40px, rgba(255,255,255,0.015) 40px 42px);
    pointer-events:none;
  }

  /* Верхняя панель */
  #topBar {
    position:relative; z-index:5;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px;
    font-size:13px;
    background:rgba(0,0,0,0.55);
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  #signal { color:#7a7a8a; }
  #batteryWrap {
    display:flex; align-items:center; gap:6px;
  }
  #batteryIcon {
    width:26px; height:13px;
    border:1.5px solid #7a7a8a;
    border-radius:3px;
    position:relative;
    padding:1.5px;
  }
  #batteryIcon::after {
    content:''; position:absolute; right:-4px; top:3px;
    width:2px; height:5px; background:#7a7a8a; border-radius:0 2px 2px 0;
  }
  #batteryFill {
    height:100%; width:60%;
    background:#7affa0;
    border-radius:1px;
    transition:width 0.4s, background 0.4s;
  }
  #batteryText { font-size:12px; color:#a0a0b0; min-width:32px; }

  /* Чат */
  #chat {
    position:relative; z-index:4;
    flex:1;
    overflow-y:auto;
    padding:16px 14px 10px;
    display:flex; flex-direction:column; gap:10px;
    scroll-behavior:smooth;
  }
  #chat::-webkit-scrollbar { width:0; }

  .msg {
    max-width:82%;
    padding:10px 14px;
    border-radius:16px;
    font-size:15px;
    line-height:1.45;
    animation:pop 0.35s ease-out;
    word-wrap:break-word;
  }
  @keyframes pop {
    from { opacity:0; transform:translateY(12px) scale(0.96); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  .msg.left {
    align-self:flex-start;
    background:rgba(60,55,90,0.9);
    border-bottom-left-radius:4px;
  }
  .msg.right {
    align-self:flex-end;
    background:rgba(35,90,140,0.9);
    border-bottom-right-radius:4px;
  }
  .msg.sys {
    align-self:center;
    background:transparent;
    color:#8a8a9a;
    font-size:12.5px;
    font-style:italic;
    text-align:center;
    max-width:95%;
  }

  /* Мигание света */
  #flash {
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    z-index:9;
  }
  #flash.on { animation: flashAnim 0.5s; }
  @keyframes flashAnim {
    0% { opacity:0; }
    40% { opacity:0.7; }
    100% { opacity:0; }
  }

  /* Панель кнопок */
  #choices {
    position:relative; z-index:6;
    padding:12px 14px 22px;
    display:flex; flex-direction:column; gap:8px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.85) 30%);
    min-height:60px;
  }
  .btn {
    padding:13px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(30,30,50,0.85);
    color:#e8e8e8;
    font-size:15px;
    cursor:pointer;
    transition:all 0.2s;
    text-align:center;
  }
  .btn:active {
    background:rgba(60,60,100,0.95);
    transform:scale(0.98);
  }
  .btn.primary {
    background:rgba(80,60,140,0.9);
    border-color:rgba(140,120,220,0.4);
  }
  .btn.primary:active { background:rgba(110,85,180,1); }

  .tapHint {
    align-self:center;
    color:#5a5a6a;
    font-size:12px;
    margin-top:4px;
    animation:pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:0.4; }
    50% { opacity:1; }
  }

  /* Экран конца игры */
  #endScreen {
    position:absolute; inset:0;
    background:rgba(0,0,0,0.94);
    z-index:20;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
    gap:20px;
  }
  #endScreen.show { display:flex; }
  #endTitle { font-size:24px; font-weight:600; }
  #endText { font-size:15px; color:#a0a0b0; line-height:1.6; }
  #restart {
    margin-top:10px;
    padding:14px 32px;
    border-radius:30px;
    background:rgba(120,90,220,0.9);
    border:none;
    color:#fff;
    font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="game">
  <div id="trainBg"></div>

  <div id="topBar">
    <div id="signal">📵 нет сети</div>
    <div id="batteryWrap">
      <div id="batteryIcon"><div id="batteryFill"></div></div>
      <div id="batteryText">60%</div>
    </div>
  </div>

  <div id="chat"></div>
  <div id="choices"></div>
  <div id="flash"></div>

  <div id="endScreen">
    <div id="endTitle"></div>
    <div id="endText"></div>
    <button id="restart">Играть заново</button>
  </div>
</div>

<script>
/* ================== СОСТОЯНИЕ ================== */
const S = {
  battery: 60,
  trust: 0,     // уровень доверия
  flashes: 0,   // сколько раз мигал свет
  named: false, // назвал ли имя
  step: 0
};

const chat = document.getElementById('chat');
const choicesEl = document.getElementById('choices');
const batteryFill = document.getElementById('batteryFill');
const batteryText = document.getElementById('batteryText');
const flash = document.getElementById('flash');
const endScreen = document.getElementById('endScreen');
const endTitle = document.getElementById('endTitle');
const endText = document.getElementById('endText');

/* ================== УТИЛИТЫ ================== */
function setBattery(v) {
  S.battery = Math.max(0, Math.min(100, v));
  batteryFill.style.width = S.battery + '%';
  batteryText.textContent = S.battery + '%';
  if (S.battery <= 15) batteryFill.style.background = '#ff5a5a';
  else if (S.battery <= 40) batteryFill.style.background = '#ffcc5a';
  else batteryFill.style.background = '#7affa0';
}

function addMsg(text, side = 'left', cb) {
  const d = document.createElement('div');
  d.className = 'msg ' + side;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  if (cb) setTimeout(cb, 350);
}

function addSys(text) {
  const d = document.createElement('div');
  d.className = 'msg sys';
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function clearChoices() { choicesEl.innerHTML = ''; }

function makeChoice(label, action, isPrimary=false) {
  const b = document.createElement('button');
  b.className = 'btn' + (isPrimary ? ' primary' : '');
  b.textContent = label;
  b.onclick = () => { clearChoices(); action(); };
  choicesEl.appendChild(b);
}

function waitTap(cb) {
  const hint = document.createElement('div');
  hint.className = 'tapHint';
  hint.textContent = 'нажми, чтобы продолжить';
  choicesEl.appendChild(hint);
  const handler = (e) => {
    e.preventDefault();
    choicesEl.removeEventListener('touchstart', handler);
    choicesEl.removeEventListener('click', handler);
    clearChoices();
    cb();
  };
  choicesEl.addEventListener('touchstart', handler, {once:true});
  choicesEl.addEventListener('click', handler, {once:true});
}

function triggerFlash(cb) {
  S.flashes++;
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on');
  addSys(`⚡ свет мигнул (${S.flashes}/3)`);
  setTimeout(cb, 700);
}

function spend(n) {
  setBattery(S.battery - n);
}

/* ================== СЦЕНАРИЙ ================== */

function start() {
  S.battery = 60; S.trust = 0; S.flashes = 0; S.named = false;
  chat.innerHTML = '';
  endScreen.classList.remove('show');
  setBattery(S.battery);

  addSys('Ночной поезд. Купе №7.');
  addSys('Твой телефон почти разряжен. Зарядки нет.');

  setTimeout(() => {
    addMsg('Дверь купе открывается. Входит незнакомец и садится напротив.', 'sys');
  }, 600);

  setTimeout(() => {
    addMsg('Ты тоже не спишь?', 'left');
    waitTap(scene1);
  }, 1600);
}

function scene1() {
  addMsg('Похоже, у нас обоих проблемы с зарядкой.', 'left');
  addMsg('Слушай… у тебя сколько процентов?', 'left');

  makeChoice('«60%. А у тебя?»', () => {
    S.trust++;
    addMsg('60%. А у тебя?', 'right');
    spend(1);
    setTimeout(() => {
      addMsg('Два. Хватит, чтобы сказать главное.', 'left');
      setTimeout(scene2, 900);
    }, 700);
  }, true);

  makeChoice('Промолчать и отвернуться', () => {
    addMsg('…', 'right');
    spend(1);
    setTimeout(() => {
      addMsg('Не доверяешь. Правильно.', 'left');
      addMsg('Но у нас мало времени.', 'left');
      setTimeout(scene2, 1400);
    }, 700);
  });
}

function scene2() {
  addMsg('Правила такие:', 'left');
  addMsg('Если свет мигнёт три раза — хватай мой телефон и беги в тамбур. Не оглядывайся.', 'left');

  makeChoice('«Почему я должен тебе верить?»', () => {
    S.trust++;
    addMsg('Почему я должен тебе верить?', 'right');
    spend(1);
    setTimeout(() => {
      addMsg('Не должен. Просто запомни.', 'left');
      setTimeout(scene3, 900);
    }, 700);
  }, true);

  makeChoice('«Хорошо. Договорились.»', () => {
    addMsg('Хорошо. Договорились.', 'right');
    spend(1);
    setTimeout(() => {
      addMsg('Умница.', 'left');
      setTimeout(scene3, 900);
    }, 700);
  });

  makeChoice('«Мне это неинтересно.»', () => {
    S.trust--;
    addMsg('Мне это неинтересно.', 'right');
    spend(1);
    setTimeout(() => {
      addMsg('Тогда пеняй на себя.', 'left');
      setTimeout(scene3, 900);
    }, 700);
  });
}

function scene3() {
  addSys('Поезд замедляется. За окном — темнота.');
  spend(2);

  setTimeout(() => {
    triggerFlash(() => {
      addMsg('Ты это видел?', 'left');
      makeChoice('«Да. Свет мигнул.»', () => {
        S.trust++;
        addMsg('Да. Свет мигнул.', 'right');
        spend(1);
        setTimeout(scene4, 800);
      }, true);
      makeChoice('«Показалось.»', () => {
        addMsg('Показалось.', 'right');
        spend(1);
        setTimeout(() => {
          addMsg('Нет. Это только начало.', 'left');
          setTimeout(scene4, 900);
        }, 600);
      });
    });
  }, 1200);
}

function scene4() {
  addMsg('Слушай… как тебя зовут?', 'left');
  addSys('Внимание: имя — это ключ.');

  makeChoice('Назвать своё имя', () => {
    S.named = true;
    addMsg('Меня зовут… (ты называешь имя)', 'right');
    spend(2);
    setTimeout(() => {
      addMsg('Спасибо. Теперь я знаю, кого искать.', 'left');
      addMsg('Прости.', 'left');
      setTimeout(scene5, 1400);
    }, 1000);
  }, true);

  makeChoice('«Сначала ты.»', () => {
    S.trust++;
    addMsg('Сначала ты.', 'right');
    spend(1);
    setTimeout(() => {
      addMsg('Хитро. Мне нравится.', 'left');
      addMsg('Но у меня нет имени. Я — просто попутчик.', 'left');
      setTimeout(scene5, 1400);
    }, 900);
  });

  makeChoice('Соврать', () => {
    addMsg('Меня зовут Алекс.', 'right');
    spend(1);
    setTimeout(() => {
      addMsg('Врёшь. Но это тоже ответ.', 'left');
      S.trust--;
      setTimeout(scene5, 1200);
    }, 900);
  });
}

function scene5() {
  addSys('Свет мигает второй раз.');
  triggerFlash(() => {
    addMsg('В коридоре шаги.', 'sys');
    spend(2);

    makeChoice('Открыть дверь', () => {
      addMsg('Ты открываешь дверь. Там пусто.', 'sys');
      spend(3);
      setTimeout(() => {
        addMsg('Я же говорил — не открывай.', 'left');
        S.trust--;
        setTimeout(scene6, 1000);
      }, 900);
    });

    makeChoice('Спрятаться под стол', () => {
      addMsg('Ты прячешься. Шаги проходят мимо.', 'sys');
      spend(1);
      S.trust++;
      setTimeout(scene6, 1200);
    }, true);

    makeChoice('Посмотреть в щель', () => {
      addMsg('Ты видишь… себя. Идущего по коридору.', 'sys');
      spend(4);
      setTimeout(() => {
        addMsg('Не смотри.', 'left');
        setTimeout(scene6, 900);
      }, 1000);
    });
  });
}

function scene6() {
  addSys('Свет мигает третий раз.');
  triggerFlash(() => {
    addMsg('ВСЁ. БЕГИ.', 'left');
    spend(2);

    makeChoice('Схватить телефон и бежать', () => {
      addMsg('Ты хватаешь телефон и бежишь в тамбур.', 'sys');
      spend(3);
      setTimeout(finish, 1200);
    }, true);

    makeChoice('Остаться с незнакомцем', () => {
      addMsg('Ты остаёшься.', 'sys');
      S.trust++;
      spend(1);
      setTimeout(finish, 1200);
    });

    makeChoice('Разбить телефон', () => {
      addMsg('Ты бьёшь телефон об пол. Свет гаснет полностью.', 'sys');
      spend(5);
      setTimeout(finish, 1200);
    });
  });
}

function finish() {
  let title, text;

  if (S.battery <= 0) {
    title = '🔋 Батарея мертва';
    text = 'Экран погас. Ты остался в темноте один. Утром поезд приехал пустым.';
  } else if (S.named && S.trust >= 3) {
    title = '🌅 Рассвет';
    text = 'Ты назвал имя — и незнакомец исчез. Но в твоём телефоне остался один контакт без имени. Ты знаешь, что это он. И что однажды он позвонит.';
  } else if (S.trust >= 4) {
    title = '🤝 Попутчики';
    text = 'Вы вышли вместе на станции, которой нет на карте. Незнакомец улыбнулся и сказал: «Увидимся в следующем поезде». Ты поверил.';
  } else if (S.trust <= 1) {
    title = '🚪 Один';
    text = 'Ты вышел на своей станции. Незнакомца в купе больше не было. Только его телефон на сиденье — с одним процентом заряда и твоим именем на экране.';
  } else {
    title = '🌫️ Туман';
    text = 'Поезд остановился. Двери открылись. Ты не помнишь, как оказался на перроне. В кармане — чужой телефон. Он звонит.';
  }

  endTitle.textContent = title;
  endText.textContent = text;
  endScreen.classList.add('show');
}

/* ================== ЗАПУСК ================== */
document.getElementById('restart').onclick = start;
start();
</script>
</body>
</html>
