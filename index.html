<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПОСЛЕДНИЙ СВЕТ · VioKrista</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#050510;color:#fff}
#app{position:fixed;inset:0;overflow:hidden}

/* ===== ЗВЁЗДНОЕ НЕБО ===== */
#stars{position:absolute;inset:0;z-index:1}
.star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8)}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* ===== ПАДАЮЩАЯ ЗВЕЗДА ===== */
#falling-star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;
  box-shadow:0 0 20px 4px #FBBF24,0 0 40px 8px rgba(251,191,36,.5);z-index:2;opacity:0}
@keyframes fall{
  0%{opacity:0;transform:translate(0,0) scale(0)}
  10%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(-80vw,80vh) scale(0.3)}
}

/* ===== ТУМАН НА ФОНЕ ===== */
.fog{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none;z-index:3}
.fog-1{width:500px;height:500px;background:#4C1D95;top:-100px;left:-100px;animation:drift1 25s infinite ease-in-out}
.fog-2{width:600px;height:600px;background:#1E1B4B;bottom:-200px;right:-200px;animation:drift2 30s infinite ease-in-out}
.fog-3{width:400px;height:400px;background:#5B21B6;top:30%;left:40%;animation:drift3 20s infinite ease-in-out}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-100px,-80px)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,100px)}}

/* ===== ВИНЬЕТКА И СВЕЧЕНИЕ ===== */
.vignette{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(5,5,16,.9) 100%)}
.warm-glow{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(circle at 50% 80%,rgba(251,191,36,.08),transparent 60%)}

/* ===== ЧАСТИЦЫ ===== */
#particles{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#FBBF24;
  box-shadow:0 0 10px #FBBF24;opacity:0}
@keyframes floatP{
  0%{opacity:0;transform:translateY(0) translateX(0)}
  10%{opacity:.9}
  90%{opacity:.6}
  100%{opacity:0;transform:translateY(-100vh) translateX(var(--dx,20px))}
}

/* ===== ЭКРАН ЗАГРУЗКИ ===== */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:20px}
.screen.active{display:flex;animation:fadeIn .8s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:scale(1)}}

.title-main{font-size:clamp(34px,10vw,72px);font-weight:900;letter-spacing:6px;
  background:linear-gradient(180deg,#FFF8DC 0%,#FBBF24 50%,#B45309 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;line-height:1;margin-bottom:8px;
  filter:drop-shadow(0 0 30px rgba(251,191,36,.6));
  animation:titleGlow 3s infinite alternate}
@keyframes titleGlow{
  0%{filter:drop-shadow(0 0 30px rgba(251,191,36,.5))}
  100%{filter:drop-shadow(0 0 50px rgba(251,191,36,.9))}
}

.title-sub{font-size:clamp(11px,3vw,14px);letter-spacing:8px;color:#C4B5FD;
  font-weight:600;margin-bottom:30px;opacity:.8;text-transform:uppercase}

.title-brand{font-size:clamp(14px,4vw,18px);letter-spacing:4px;
  background:linear-gradient(90deg,#FBBF24,#F472B6,#A78BFA);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-weight:800;margin-top:20px;opacity:.9}

.divider{width:80px;height:2px;background:linear-gradient(90deg,transparent,#FBBF24,transparent);margin:25px 0}

/* ===== КНОПКИ ===== */
.btn{padding:16px 44px;font-size:clamp(15px,4vw,18px);font-weight:700;border:none;border-radius:50px;
  cursor:pointer;font-family:inherit;letter-spacing:1px;position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease}
.btn:active{transform:scale(.96)}

.btn-gold{background:linear-gradient(135deg,#FBBF24 0%,#F59E0B 50%,#B45309 100%);color:#1a0f2e;
  box-shadow:0 10px 40px rgba(251,191,36,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-gold:hover{box-shadow:0 15px 50px rgba(251,191,36,.7),inset 0 1px 0 rgba(255,255,255,.3)}

.btn-ghost{background:rgba(139,92,246,.15);border:2px solid rgba(139,92,246,.5);color:#E9D5FF;
  box-shadow:0 5px 25px rgba(139,92,246,.2)}
.btn-ghost:hover{background:rgba(139,92,246,.3);border-color:#A78BFA}

/* Пульсация для главной кнопки */
@keyframes pulse{0%,100%{box-shadow:0 10px 40px rgba(251,191,36,.5)}
  50%{box-shadow:0 10px 50px rgba(251,191,36,.9),0 0 60px rgba(251,191,36,.4)}}
.pulse{animation:pulse 2s infinite}

/* ===== МЕНЮ ===== */
.menu-title{font-size:clamp(24px,7vw,44px);font-weight:900;letter-spacing:3px;
  background:linear-gradient(180deg,#FFF8DC,#FBBF24);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:10px;text-align:center;filter:drop-shadow(0 0 20px rgba(251,191,36,.5))}
.menu-sub{font-size:clamp(12px,3.5vw,15px);color:#C4B5FD;margin-bottom:35px;text-align:center;letter-spacing:2px;opacity:.8}

.menu-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.menu-btn{padding:16px 24px;background:rgba(30,27,75,.7);border:2px solid rgba(139,92,246,.4);
  border-radius:16px;color:#E9D5FF;font-size:clamp(15px,4vw,17px);font-weight:700;
  cursor:pointer;font-family:inherit;text-align:left;transition:all .25s ease;
  backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;letter-spacing:.5px;
  box-shadow:0 5px 20px rgba(0,0,0,.3)}
.menu-btn:hover,.menu-btn:active{background:rgba(139,92,246,.35);border-color:#FBBF24;
  transform:translateX(6px);box-shadow:0 5px 30px rgba(251,191,36,.3);color:#fff}
.menu-btn .ico{font-size:22px;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(251,191,36,.4))}
.menu-btn .lbl{flex:1}
.menu-btn .lbl small{display:block;font-size:11px;color:#A78BFA;font-weight:500;
  letter-spacing:1px;margin-top:2px;opacity:.8}

/* ===== ЯЗЫК ===== */
.lang-btn{position:absolute;top:16px;right:16px;z-index:50;padding:10px 16px;
  background:rgba(20,17,45,.85);border:2px solid rgba(139,92,246,.5);border-radius:50px;
  color:#E9D5FF;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;
  backdrop-filter:blur(10px);letter-spacing:1px;transition:all .2s}
.lang-btn:hover{background:rgba(139,92,246,.4);border-color:#FBBF24;color:#fff}

/* ===== НИЖНЯЯ ПОДПИСЬ ===== */
.credit{position:absolute;bottom:20px;left:0;right:0;text-align:center;
  font-size:11px;color:#6D28D9;letter-spacing:2px;z-index:10;opacity:.7}

/* ===== СВЕЧЕНИЕ ЛОГОТИПА (звёздочка) ===== */
.star-logo{width:clamp(60px,18vw,100px);height:clamp(60px,18vw,100px);margin-bottom:20px;
  position:relative;filter:drop-shadow(0 0 30px rgba(251,191,36,.8))}
.star-logo svg{width:100%;height:100%;animation:spin 20s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.star-pulse{position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,191,36,.4),transparent 70%);animation:starPulse 2s infinite}
@keyframes starPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.3);opacity:1}}

/* ===== ВЕРСИЯ ===== */
.version{position:absolute;bottom:50px;left:20px;font-size:10px;color:#4C1D95;
  letter-spacing:1px;z-index:10;font-weight:700}
</style>
</head>
<body>

<div id="app">
  <!-- ЗВЁЗДЫ -->
  <div id="stars"></div>

  <!-- ПАДАЮЩАЯ ЗВЕЗДА -->
  <div id="falling-star"></div>

  <!-- ТУМАН -->
  <div class="fog fog-1"></div>
  <div class="fog fog-2"></div>
  <div class="fog fog-3"></div>

  <!-- ЧАСТИЦЫ -->
  <div id="particles"></div>

  <!-- ВИНЬЕТКА + СВЕЧЕНИЕ -->
  <div class="vignette"></div>
  <div class="warm-glow"></div>

  <!-- КНОПКА ЯЗЫКА -->
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">🌐 RU</button>

  <!-- ============ ЭКРАН 1: ЗАГРУЗКА ============ -->
  <div class="screen active" id="screen-load">
    <div class="star-logo">
      <div class="star-pulse"></div>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="starG">
            <stop offset="0%" stop-color="#FFF8DC"/>
            <stop offset="50%" stop-color="#FBBF24"/>
            <stop offset="100%" stop-color="#B45309"/>
          </radialGradient>
        </defs>
        <polygon points="50,5 61,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 39,38"
          fill="url(#starG)" stroke="#FBBF24" stroke-width="1"/>
      </svg>
    </div>

    <div class="title-main" id="titleMain">ПОСЛЕДНИЙ СВЕТ</div>
    <div class="title-sub" id="titleSub">ГОРОД, КОТОРЫЙ ПОМНИТ</div>

    <div class="divider"></div>

    <button class="btn btn-gold pulse" id="startBtn" onclick="goToMenu()" data-i18n="start">✨ ВОЙТИ В ИСТОРИЮ</button>

    <div class="title-brand">VIOKRISTA</div>
  </div>

  <!-- ============ ЭКРАН 2: МЕНЮ ============ -->
  <div class="screen" id="screen-menu">
    <div class="menu-title" id="menuTitle">ГЛАВНОЕ МЕНЮ</div>
    <div class="menu-sub" id="menuSub">Что ты выберешь сегодня?</div>

    <div class="menu-list">
      <button class="menu-btn" onclick="notReady('continue')">
        <span class="ico">▶️</span>
        <span class="lbl"><span data-i18n="menu_continue">Продолжить</span><small id="continueInfo" data-i18n="menu_continue_sub">Глава 1 · Скоро</small></span>
      </button>

      <button class="menu-btn" onclick="notReady('new')">
        <span class="ico">✨</span>
        <span class="lbl"><span data-i18n="menu_new">Новая история</span><small data-i18n="menu_new_sub">Начать с начала</small></span>
      </button>

      <button class="menu-btn" onclick="notReady('chars')">
        <span class="ico">👥</span>
        <span class="lbl"><span data-i18n="menu_chars">Персонажи</span><small data-i18n="menu_chars_sub">Луна, Элиан, Флик…</small></span>
      </button>

      <button class="menu-btn" onclick="notReady('collect')">
        <span class="ico">📖</span>
        <span class="lbl"><span data-i18n="menu_collect">Коллекция</span><small data-i18n="menu_collect_sub">Воспоминания и находки</small></span>
      </button>

      <button class="menu-btn" onclick="notReady('settings')">
        <span class="ico">⚙️</span>
        <span class="lbl"><span data-i18n="menu_settings">Настройки</span><small data-i18n="menu_settings_sub">Звук, язык, сложность</small></span>
      </button>
    </div>

    <div class="divider"></div>
    <div style="font-size:12px;color:#6D28D9;letter-spacing:3px;font-weight:700" id="menuBrand">VIOKRISTA</div>
  </div>

  <!-- НИЖНЯЯ ПОДПИСЬ -->
  <div class="credit" id="credit">© VIOKRISTA · 2026</div>
  <div class="version" id="version">v0.1 · ЭТАП 1</div>
</div>

<script>
/* ============ ЯЗЫКИ ============ */
const translations = {
  ru: {
    start: '✨ ВОЙТИ В ИСТОРИЮ',
    menu_title: 'ГЛАВНОЕ МЕНЮ',
    menu_sub: 'Что ты выберешь сегодня?',
    menu_continue: 'Продолжить',
    menu_continue_sub: 'Глава 1 · Скоро',
    menu_new: 'Новая история',
    menu_new_sub: 'Начать с начала',
    menu_chars: 'Персонажи',
    menu_chars_sub: 'Луна, Элиан, Флик…',
    menu_collect: 'Коллекция',
    menu_collect_sub: 'Воспоминания и находки',
    menu_settings: 'Настройки',
    menu_settings_sub: 'Звук, язык, сложность',
    not_ready: 'Скоро здесь появится этот раздел ✨'
  },
  en: {
    start: '✨ ENTER THE STORY',
    menu_title: 'MAIN MENU',
    menu_sub: 'What will you choose today?',
    menu_continue: 'Continue',
    menu_continue_sub: 'Chapter 1 · Soon',
    menu_new: 'New story',
    menu_new_sub: 'Start from the beginning',
    menu_chars: 'Characters',
    menu_chars_sub: 'Luna, Elian, Flick…',
    menu_collect: 'Collection',
    menu_collect_sub: 'Memories and finds',
    menu_settings: 'Settings',
    menu_settings_sub: 'Sound, language, difficulty',
    not_ready: 'This section will appear soon ✨'
  }
};

let currentLang = localStorage.getItem('ls_lang') || 'ru';

function toggleLang(){
  currentLang = currentLang === 'ru' ? 'en' : 'ru';
  localStorage.setItem('ls_lang', currentLang);
  applyLang();
}

function applyLang(){
  document.documentElement.lang = currentLang;
  const btn = document.getElementById('langBtn');
  if(btn) btn.textContent = '🌐 ' + currentLang.toUpperCase();
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if(translations[currentLang][k]) el.textContent = translations[currentLang][k];
  });
  // Обновить заголовки
  const mt = document.getElementById('menuTitle');
  if(mt) mt.textContent = translations[currentLang].menu_title;
  const ms = document.getElementById('menuSub');
  if(ms) ms.textContent = translations[currentLang].menu_sub;
  const ci = document.getElementById('continueInfo');
  if(ci) ci.textContent = translations[currentLang].menu_continue_sub;
}

function t(k){ return translations[currentLang][k] || k; }

/* ============ ЭКРАНЫ ============ */
function goToMenu(){
  const load = document.getElementById('screen-load');
  const menu = document.getElementById('screen-menu');
  load.classList.remove('active');
  setTimeout(() => {
    menu.classList.add('active');
  }, 400);
  // Проиграть магический эффект
  launchFallingStar();
  burstParticles();
}

function notReady(section){
  // Мягкое сообщение, что раздел в разработке
  showToast(t('not_ready'));
}

function showToast(text){
  // Создать тост
  let toast = document.getElementById('toastEl');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'toastEl';
    toast.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);
      background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#1a0f2e;padding:14px 28px;border-radius:50px;
      font-weight:800;font-size:15px;box-shadow:0 10px 40px rgba(251,191,36,.6);z-index:200;
      opacity:0;transition:all .4s ease;pointer-events:none;text-align:center;max-width:88vw;
      letter-spacing:.5px;font-family:inherit`;
    document.body.appendChild(toast);
  }
  toast.textContent = text;
  requestAnimationFrame(() => {
    toast.style.transform = 'translateX(-50%) translateY(0)';
    toast.style.opacity = '1';
  });
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => {
    toast.style.transform = 'translateX(-50%) translateY(100px)';
    toast.style.opacity = '0';
  }, 2400);
}

/* ============ ЗВЁЗДЫ ============ */
function createStars(){
  const cont = document.getElementById('stars');
  cont.innerHTML = '';
  const count = Math.min(140, Math.floor(window.innerWidth / 6));
  for(let i = 0; i < count; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.2 + 0.6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    const dur = 2 + Math.random() * 4;
    const delay = Math.random() * 5;
    s.style.animation = `twinkle ${dur}s infinite ease-in-out`;
    s.style.animationDelay = delay + 's';
    // Некоторые звёзды золотые
    if(Math.random() < 0.15){
      s.style.background = '#FBBF24';
      s.style.boxShadow = '0 0 10px #FBBF24, 0 0 20px rgba(251,191,36,.5)';
    }
    cont.appendChild(s);
  }
}

/* ============ ПАДАЮЩАЯ ЗВЕЗДА ============ */
function launchFallingStar(){
  const star = document.getElementById('falling-star');
  star.style.left = (30 + Math.random() * 40) + '%';
  star.style.top = '10%';
  star.style.animation = 'none';
  void star.offsetWidth;
  star.style.animation = 'fall 2.5s ease-in forwards';
}

/* Периодически запускать */
setInterval(() => {
  if(document.getElementById('screen-menu').classList.contains('active')){
    launchFallingStar();
  }
}, 8000);

/* ============ ЧАСТИЦЫ ============ */
function spawnParticle(){
  const cont = document.getElementById('particles');
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.top = (90 + Math.random() * 15) + '%';
  const dx = (Math.random() * 80 - 40) + 'px';
  p.style.setProperty('--dx', dx);
  const dur = 6 + Math.random() * 8;
  p.style.animation = `floatP ${dur}s linear forwards`;
  cont.appendChild(p);
  setTimeout(() => p.remove(), dur * 1000 + 200);
}

function burstParticles(){
  for(let i = 0; i < 25; i++){
    setTimeout(spawnParticle, i * 40);
  }
}

// Постоянный поток частиц
setInterval(spawnParticle, 400);

/* ============ СОБЫТИЯ ============ */
window.addEventListener('load', () => {
  createStars();
  applyLang();
  // Показать первую падающую звезду через 1.5 секунды
  setTimeout(launchFallingStar, 1500);
});

window.addEventListener('resize', () => {
  createStars();
});

// Клик по фону — эффект
document.getElementById('app').addEventListener('click', (e) => {
  if(e.target.closest('button')) return;
  burstParticles();
});

// Свайп/тап — быстрая перезагрузка звёзд на всякий случай
let lastTap = 0;
document.getElementById('app').addEventListener('touchend', () => {
  const now = Date.now();
  if(now - lastTap < 300){
    createStars();
    burstParticles();
  }
  lastTap = now;
});
</script>
</body>
</html>
