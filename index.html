<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Хроники Тихого Света — Глава 1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a14;color:#fff}
#game{position:fixed;inset:0;overflow:hidden}
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1.2s ease;opacity:0}
.bg-layer.active{opacity:1}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;pointer-events:none;opacity:.7}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7) 100%);z-index:5}
.dialogue-box{position:absolute;left:0;right:0;bottom:0;padding:20px;z-index:20;
  background:linear-gradient(to top,rgba(10,10,20,.98) 0%,rgba(10,10,20,.9) 70%,transparent 100%);
  transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);padding-bottom:30px}
.dialogue-box.show{transform:translateY(0)}
.speaker{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-left:5px}
.speaker-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,#A78BFA);
  display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #FBBF24;
  box-shadow:0 0 20px rgba(251,191,36,.5);flex-shrink:0;position:relative}
.speaker-avatar.speaking::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid #FBBF24;animation:speakRing 1s infinite}
@keyframes speakRing{0%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
.speaker-name{font-size:17px;font-weight:800;color:#FBBF24}
.speaker-name.thought{color:#A78BFA;font-style:italic}
.dialogue-text{font-size:clamp(15px,4.2vw,18px);line-height:1.55;color:#E9D5FF;
  min-height:70px;max-width:700px;margin:0 auto;padding:0 5px}
.dialogue-text.thought{color:#C4B5FD;font-style:italic;opacity:.9}
.next-arrow{position:absolute;right:25px;bottom:15px;color:#FBBF24;font-size:22px;
  animation:bounceDown 1.2s infinite;opacity:0;transition:opacity .3s;pointer-events:none}
.next-arrow.show{opacity:1}
@keyframes bounceDown{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.choices{position:absolute;left:0;right:0;bottom:0;padding:20px;z-index:25;
  display:none;flex-direction:column;gap:12px;max-width:700px;margin:0 auto;
  transform:translateY(20px);opacity:0;transition:all .4s ease}
.choices.show{display:flex;transform:translateY(0);opacity:1}
.choice-btn{padding:16px 22px;background:rgba(26,26,46,.95);border:2px solid rgba(139,92,246,.6);
  border-radius:16px;color:#fff;font-size:clamp(14px,4vw,17px);font-weight:700;cursor:pointer;
  font-family:inherit;text-align:left;transition:all .2s ease;backdrop-filter:blur(10px)}
.choice-btn:hover,.choice-btn:active{background:rgba(139,92,246,.4);border-color:#FBBF24;transform:translateX(6px)}
.choice-btn .tag{font-size:11px;color:#FBBF24;font-weight:600;display:block;margin-top:4px;opacity:.8}
.character{position:absolute;bottom:0;height:75vh;max-height:600px;width:auto;
  opacity:0;transition:opacity .8s ease, transform 1.5s ease;pointer-events:none;z-index:10;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.character.show{opacity:1}
.character.right{right:5%;transform:translateX(20px)}
.character.right.show{transform:translateX(0)}
.character.center{left:50%;transform:translateX(-50%) translateY(20px)}
.character.center.show{transform:translateX(-50%) translateY(0)}
.mouth{transform-origin:center}
.character.talking .mouth{animation:talkMouth .25s infinite alternate}
@keyframes talkMouth{0%{transform:scaleY(1)}100%{transform:scaleY(1.8)}}
.hud-top{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;
  align-items:center;z-index:30;pointer-events:none}
.chapter-label{padding:8px 16px;background:rgba(26,26,46,.8);border:1px solid rgba(139,92,246,.4);
  border-radius:20px;font-size:13px;font-weight:700;color:#FBBF24;backdrop-filter:blur(10px)}
.hud-right{display:flex;gap:8px;pointer-events:auto}
.icon-btn{padding:8px 12px;background:rgba(26,26,46,.8);border:1px solid rgba(139,92,246,.4);
  border-radius:20px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  backdrop-filter:blur(10px);min-width:44px;transition:all .2s}
.icon-btn:hover{background:rgba(139,92,246,.4);border-color:#FBBF24}
.icon-btn.off{opacity:.35}
.progress-dots{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:30;pointer-events:none}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.dot.active{background:#FBBF24;width:24px;border-radius:4px}
.end-screen{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a1a2e,#0a0a14);
  display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:30px;
  text-align:center;opacity:0;transition:opacity 1.5s ease}
.end-screen.show{display:flex;opacity:1}
.end-title{font-size:clamp(28px,7vw,48px);font-weight:900;margin-bottom:20px;
  background:linear-gradient(90deg,#FBBF24,#F472B6,#A78BFA);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.end-sub{font-size:clamp(13px,3.8vw,17px);color:#C4B5FD;margin-bottom:30px;line-height:1.7;max-width:500px}
.end-btn{padding:16px 40px;font-size:17px;font-weight:700;border:none;border-radius:50px;
  background:linear-gradient(90deg,#FBBF24,#F59E0B);color:#0a0a14;cursor:pointer;
  font-family:inherit;box-shadow:0 10px 30px rgba(251,191,36,.5);transition:transform .15s}
.end-btn:active{transform:scale(.95)}
.loader{position:absolute;inset:0;background:#0a0a14;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:200;transition:opacity 1s ease;gap:20px}
.loader.hide{opacity:0;pointer-events:none}
.loader-title{font-size:clamp(24px,7vw,44px);font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,#FBBF24,#F472B6,#A78BFA);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;text-align:center;padding:0 20px}
.loader-sub{font-size:clamp(12px,3.5vw,16px);color:#C4B5FD;text-align:center;padding:0 20px;line-height:1.5}
.loader-btn{margin-top:20px;padding:16px 40px;font-size:17px;font-weight:700;border:none;
  border-radius:50px;background:linear-gradient(90deg,#8B5CF6,#A78BFA);color:#fff;cursor:pointer;
  font-family:inherit;box-shadow:0 10px 30px rgba(139,92,246,.5);transition:transform .15s}
.loader-btn:active{transform:scale(.95)}
.scene-caption{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(18px,5vw,28px);font-weight:700;color:#FBBF24;text-align:center;
  opacity:0;transition:opacity 1.5s ease;pointer-events:none;z-index:15;padding:0 30px;
  text-shadow:0 0 30px rgba(251,191,36,.8);letter-spacing:2px}
.scene-caption.show{opacity:1}
/* Индикатор звука */
.sound-status{position:absolute;top:60px;left:50%;transform:translateX(-50%);
  padding:8px 20px;background:rgba(34,197,94,.9);color:#fff;border-radius:20px;
  font-size:13px;font-weight:700;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
.sound-status.show{opacity:1}
</style>
</head>
<body>
<div id="game">
  <div class="loader" id="loader">
    <div class="loader-title">ХРОНИКИ<br>ТИХОГО СВЕТА</div>
    <div class="loader-sub" id="loaderSub">Некоторые двери открываются только для тех,<br>кто потерял что-то важное.</div>
    <button class="loader-btn" id="startBtn">🔊 Начать историю</button>
    <div style="font-size:12px;color:#8B5CF6;margin-top:10px;text-align:center">Нажми кнопку — звук включится автоматически</div>
  </div>
  <div class="bg-layer" id="bg1"></div>
  <div class="bg-layer" id="bg2"></div>
  <div class="particles" id="particles"></div>
  <div class="vignette"></div>
  <div class="scene-caption" id="sceneCaption"></div>
  <div id="charLayer"></div>
  <div class="hud-top">
    <div class="chapter-label" id="chapterLabel">Глава 1</div>
    <div class="hud-right">
      <button class="icon-btn" id="soundBtn" title="Звук">🔊</button>
      <button class="icon-btn" id="langBtn" title="Язык">🌐 RU</button>
    </div>
  </div>
  <div class="sound-status" id="soundStatus">🔊 Звук включён</div>
  <div class="dialogue-box" id="dialogueBox">
    <div class="speaker">
      <div class="speaker-avatar" id="speakerAvatar">👤</div>
      <div class="speaker-name" id="speakerName">Герой</div>
    </div>
    <div class="dialogue-text" id="dialogueText"></div>
    <div class="next-arrow" id="nextArrow">▼</div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="progress-dots" id="progressDots"></div>
  <div class="end-screen" id="endScreen">
    <div class="end-title" id="endTitle">Конец главы 1</div>
    <div class="end-sub" id="endSub"></div>
    <button class="end-btn" id="endBtn">Продолжить путь</button>
  </div>
</div>

<script>
/* ===== НАСТРОЙКИ ===== */
let soundOn = localStorage.getItem('ts_sound') !== 'off';

/* ===== АУДИО-КОНТЕКСТ ===== */
let audioCtx = null;
let musicLoopTimer = null;
let currentMusicScene = null;

function initAudio(){
  if(!audioCtx){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){ console.log('AudioContext not supported'); return false; }
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().then(()=>{
      console.log('AudioContext resumed');
    });
  }
  return true;
}

function playTone(freq, dur, type='sine', vol=0.08){
  if(!soundOn || !audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }catch(e){}
}

function sfxClick(){ playTone(700, 0.08, 'square', 0.12); }
function sfxChoice(){ playTone(900, 0.1, 'sine', 0.14); setTimeout(()=>playTone(1200, 0.1, 'sine', 0.12), 100); }
function sfxMagic(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.3, 'sine', 0.12), i * 120)); }

/* ===== МУЗЫКА ===== */
const MusicScenes = {
  car:   { notes: [220, 261.63, 329.63, 392, 329.63, 261.63], tempo: 750, type: 'sine', vol: 0.06 },
  house: { notes: [293.66, 349.23, 440, 523.25, 440, 349.23], tempo: 850, type: 'triangle', vol: 0.06 },
  night: { notes: [174.61, 196, 220, 196, 174.61, 155.56], tempo: 1100, type: 'sine', vol: 0.05 },
  magic: { notes: [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25], tempo: 650, type: 'sine', vol: 0.06 },
  room:  { notes: [246.94, 293.66, 349.23, 293.66, 246.94, 220], tempo: 950, type: 'triangle', vol: 0.055 }
};

function playMusic(sceneName){
  stopMusic();
  if(!soundOn) return;
  if(!audioCtx) return;
  const cfg = MusicScenes[sceneName] || MusicScenes.night;
  currentMusicScene = sceneName;
  let idx = 0;
  // Сразу играем первую ноту
  playMusicNote(cfg, idx);
  idx++;
  musicLoopTimer = setInterval(()=>{
    if(!soundOn || !audioCtx){ return; }
    playMusicNote(cfg, idx);
    idx++;
  }, cfg.tempo);
}

function playMusicNote(cfg, idx){
  const note = cfg.notes[idx % cfg.notes.length];
  // Основная нота
  playTone(note, cfg.tempo / 1000 * 0.9, cfg.type, cfg.vol);
  // Гармония снизу
  if(idx % 2 === 0){
    playTone(note / 2, cfg.tempo / 1000 * 0.9, 'sine', cfg.vol * 0.6);
  }
  // Верхняя искра иногда
  if(idx % 4 === 2){
    setTimeout(() => playTone(note * 2, 0.35, 'sine', cfg.vol * 0.5), cfg.tempo / 2);
  }
}

function stopMusic(){
  if(musicLoopTimer){ clearInterval(musicLoopTimer); musicLoopTimer = null; }
  currentMusicScene = null;
}

/* ===== ОЗВУЧКА (если работает) ===== */
let voices = [];
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

const VoiceProfiles = {
  'Тим': { rate: 1.0, pitch: 1.2, lang: 'ru' },
  'Тим (мысли)': { rate: 0.9, pitch: 1.3, lang: 'ru', vol: 0.7 },
  'Tim': { rate: 1.0, pitch: 1.2, lang: 'en' },
  'Tim (thoughts)': { rate: 0.9, pitch: 1.3, lang: 'en', vol: 0.7 },
  'Мама': { rate: 0.95, pitch: 1.0, lang: 'ru' },
  'Mom': { rate: 0.95, pitch: 1.0, lang: 'en' },
  'Папа': { rate: 0.9, pitch: 0.8, lang: 'ru' },
  'Dad': { rate: 0.9, pitch: 0.8, lang: 'en' },
  'Бумажка': { rate: 1.15, pitch: 1.6, lang: 'ru' },
  'Paper': { rate: 1.15, pitch: 1.6, lang: 'en' },
  'Ника': { rate: 0.9, pitch: 1.1, lang: 'ru' },
  'Nika': { rate: 0.9, pitch: 1.1, lang: 'en' },
  '???': { rate: 0.9, pitch: 1.1, lang: 'ru' },
  '': { rate: 0.95, pitch: 1.0, lang: 'ru' }
};

function pickVoice(profile){
  if(!voices.length) return null;
  const langPrefix = profile.lang === 'en' ? 'en' : 'ru';
  let candidates = voices.filter(v => v.lang.toLowerCase().startsWith(langPrefix));
  if(!candidates.length) candidates = voices.filter(v => v.lang.toLowerCase().startsWith('en'));
  if(!candidates.length) candidates = voices;
  return candidates[0];
}

function speak(text, profile){
  if(!soundOn) return;
  if(!('speechSynthesis' in window)) return;
  if(!text) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const utter = new SpeechSynthesisUtterance(text);
  const p = profile || VoiceProfiles[''];
  utter.rate = p.rate || 1.0;
  utter.pitch = p.pitch || 1.0;
  utter.volume = (p.vol !== undefined ? p.vol : 1) * 0.9;
  const v = pickVoice(p);
  if(v) utter.voice = v;
  utter.lang = p.lang === 'en' ? 'en-US' : 'ru-RU';
  const avatar = document.getElementById('speakerAvatar');
  utter.onstart = () => avatar && avatar.classList.add('speaking');
  utter.onend = () => avatar && avatar.classList.remove('speaking');
  utter.onerror = () => avatar && avatar.classList.remove('speaking');
  try{ speechSynthesis.speak(utter); }catch(e){}
}
function stopSpeaking(){
  try{ speechSynthesis.cancel(); }catch(e){}
  const avatar = document.getElementById('speakerAvatar');
  if(avatar) avatar.classList.remove('speaking');
}

/* ===== ЧАСТИЦЫ ===== */
function startParticles(type){
  const cont = document.getElementById('particles');
  cont.innerHTML = '';
  const colors = { night: '#A78BFA', magic: '#FBBF24', house: '#FBBF24', void: '#8B5CF6', car: '#FBBF24', room: '#A78BFA' };
  const c = colors[type] || '#A78BFA';
  for(let i = 0; i < 25; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = c;
    p.style.boxShadow = '0 0 8px ' + c;
    p.style.left = Math.random() * 100 + '%';
    p.style.top = (100 + Math.random() * 20) + '%';
    p.style.animation = `floatUp ${8 + Math.random() * 10}s linear infinite`;
    p.style.animationDelay = (-Math.random() * 10) + 's';
    cont.appendChild(p);
  }
}
const styleEl = document.createElement('style');
styleEl.textContent = `@keyframes floatUp{0%{transform:translateY(0) translateX(0);opacity:0}
  10%{opacity:.7}90%{opacity:.4}100%{transform:translateY(-110vh) translateX(20px);opacity:0}}`;
document.head.appendChild(styleEl);

/* ===== ФОНЫ ===== */
function svgBg(svg){ return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")'; }
const BGs = {
  car: svgBg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFB88C"/><stop offset="50%" stop-color="#DE6262"/><stop offset="100%" stop-color="#3A1C71"/></linearGradient></defs><rect width="800" height="600" fill="url(#s1)"/><circle cx="650" cy="150" r="60" fill="#FFEAA7" opacity=".9"/><rect y="380" width="800" height="220" fill="#2D1B4E"/><rect x="50" y="300" width="80" height="90" fill="#3D2A5C"/><rect x="150" y="270" width="100" height="120" fill="#4A3269"/><rect x="270" y="320" width="70" height="70" fill="#3D2A5C"/><rect x="360" y="250" width="120" height="140" fill="#4A3269"/><rect x="500" y="290" width="90" height="100" fill="#3D2A5C"/><rect x="610" y="260" width="110" height="130" fill="#4A3269"/><g fill="#FFEAA7"><rect x="70" y="320" width="15" height="20"/><rect x="100" y="320" width="15" height="20"/><rect x="180" y="300" width="18" height="22"/><rect x="220" y="300" width="18" height="22"/><rect x="390" y="280" width="20" height="25"/><rect x="430" y="280" width="20" height="25"/><rect x="530" y="320" width="18" height="22"/><rect x="640" y="290" width="20" height="25"/></g></svg>`),
  house: svgBg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1A0F2E"/><stop offset="60%" stop-color="#2D1B4E"/><stop offset="100%" stop-color="#0F0820"/></linearGradient></defs><rect width="800" height="600" fill="url(#s2)"/><circle cx="650" cy="120" r="40" fill="#E9D5FF" opacity=".9"/><polygon points="200,300 400,180 600,300" fill="#5B3E7A"/><rect x="220" y="300" width="360" height="250" fill="#4A3269"/><rect x="240" y="320" width="60" height="70" fill="#FFEAA7" opacity=".8"/><rect x="500" y="320" width="60" height="70" fill="#FBBF24"/><rect x="500" y="320" width="60" height="70" fill="none" stroke="#2D1B4E" stroke-width="4"/><rect x="370" y="420" width="60" height="130" fill="#2D1B4E"/><ellipse cx="120" cy="450" rx="60" ry="80" fill="#2D1B4E"/><ellipse cx="690" cy="470" rx="70" ry="90" fill="#2D1B4E"/></svg>`),
  room: svgBg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><rect width="800" height="600" fill="#2D1B4E"/><rect width="800" height="400" fill="#3D2A5C"/><rect y="400" width="800" height="200" fill="#1A0F2E"/><rect x="550" y="100" width="180" height="240" fill="#1A0F2E"/><rect x="550" y="100" width="180" height="240" fill="none" stroke="#5B3E7A" stroke-width="8"/><circle cx="680" cy="160" r="30" fill="#E9D5FF" opacity=".7"/><rect x="80" y="380" width="300" height="100" fill="#5B3E7A" rx="10"/><rect x="80" y="350" width="300" height="40" fill="#8B5CF6" rx="10"/><rect x="420" y="420" width="120" height="80" fill="#5B3E7A"/><rect x="420" y="410" width="120" height="15" fill="#8B5CF6"/><rect x="450" y="400" width="60" height="20" fill="#FBBF24" transform="rotate(-10 480 410)"/></svg>`),
  void: svgBg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="vg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#4C1D95"/><stop offset="50%" stop-color="#2D1B4E"/><stop offset="100%" stop-color="#0A0A14"/></radialGradient></defs><rect width="800" height="600" fill="url(#vg)"/><g fill="#FBBF24"><circle cx="100" cy="80" r="2"/><circle cx="250" cy="150" r="3"/><circle cx="400" cy="60" r="2"/><circle cx="600" cy="120" r="3"/><circle cx="700" cy="200" r="2"/><circle cx="150" cy="300" r="2"/><circle cx="500" cy="250" r="3"/><circle cx="680" cy="400" r="2"/><circle cx="200" cy="500" r="3"/><circle cx="550" cy="480" r="2"/></g><rect x="50" y="400" width="100" height="200" fill="#1A0F2E" opacity=".6"/><rect x="200" y="350" width="80" height="250" fill="#1A0F2E" opacity=".5"/><rect x="320" y="420" width="120" height="180" fill="#1A0F2E" opacity=".6"/><rect x="480" y="380" width="90" height="220" fill="#1A0F2E" opacity=".5"/><rect x="620" y="440" width="140" height="160" fill="#1A0F2E" opacity=".6"/></svg>`)
};
function setBg(name){
  const bgs = [document.getElementById('bg1'), document.getElementById('bg2')];
  const current = bgs.find(b => b.classList.contains('active'));
  const next = current === bgs[0] ? bgs[1] : bgs[0];
  next.style.backgroundImage = BGs[name] || BGs.void;
  next.classList.add('active');
  if(current) current.classList.remove('active');
}

function showCharacter(who, pos){
  const layer = document.getElementById('charLayer');
  Array.from(layer.children).forEach(c => { if(c.dataset.who !== who) c.remove(); });
  if(document.querySelector(`[data-who="${who}"]`)) return;
  const ch = Characters[who]; if(!ch) return;
  const el = document.createElement('div');
  el.className = 'character ' + (pos || 'center');
  el.dataset.who = who;
  el.innerHTML = ch.svg;
  layer.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
}

let currentLang = localStorage.getItem('ts_lang') || 'ru';
let script = Script[currentLang];
let index = 0;
let isTyping = false;
let typingTimer = null;
let typeFullText = '';
let typeCharIndex = 0;
const stats = JSON.parse(localStorage.getItem('ts_stats') || '{"curiosity":0,"courage":0,"kindness":0,"observation":0,"independence":0,"creativity":0,"trust":0}');

const dlgBox = document.getElementById('dialogueBox');
const dlgText = document.getElementById('dialogueText');
const speakerName = document.getElementById('speakerName');
const speakerAvatar = document.getElementById('speakerAvatar');
const nextArrow = document.getElementById('nextArrow');
const choicesBox = document.getElementById('choices');

function saveStats(){ localStorage.setItem('ts_stats', JSON.stringify(stats)); }
function applyEffects(e){ if(!e) return; for(const k in e){ if(stats[k] !== undefined) stats[k] += e[k]; } saveStats(); }

function updateDots(){
  const dots = document.getElementById('progressDots');
  const total = script.length;
  const done = Math.round((index / total) * 10);
  if(dots.children.length !== 10){
    dots.innerHTML = '';
    for(let i = 0; i < 10; i++){ const d = document.createElement('div'); d.className = 'dot'; dots.appendChild(d); }
  }
  Array.from(dots.children).forEach((d, i) => { d.classList.toggle('active', i < done); });
}

function caption(text){
  const c = document.getElementById('sceneCaption');
  c.textContent = text;
  c.classList.add('show');
  setTimeout(() => c.classList.remove('show'), 2500);
}

function typeText(text, cb){
  isTyping = true;
  typeFullText = text;
  typeCharIndex = 0;
  dlgText.textContent = '';
  nextArrow.classList.remove('show');
  clearInterval(typingTimer);
  typingTimer = setInterval(() => {
    if(typeCharIndex >= typeFullText.length){
      clearInterval(typingTimer);
      isTyping = false;
      nextArrow.classList.add('show');
      if(cb) cb();
      return;
    }
    dlgText.textContent += typeFullText[typeCharIndex];
    typeCharIndex++;
  }, 28);
}

function showText(step){
  dlgBox.classList.add('show');
  choicesBox.classList.remove('show');
  speakerName.textContent = step.name || '';
  speakerAvatar.textContent = step.avatar || '👤';
  speakerName.classList.toggle('thought', !!step.thought);
  dlgText.classList.toggle('thought', !!step.thought);
  typeText(step.text || '', () => {
    // Озвучка после печати
    if(step.narrate) speak(step.text, VoiceProfiles['']);
    else if(step.name && VoiceProfiles[step.name]) speak(step.text, VoiceProfiles[step.name]);
    else speak(step.text, VoiceProfiles['']);
  });
  if(step.talking){
    const c = document.querySelector('.character.show');
    if(c){ c.classList.add('talking'); setTimeout(() => c.classList.remove('talking'), Math.min(4000, (step.text || '').length * 60)); }
  }
}

function showChoices(step){
  dlgBox.classList.remove('show');
  stopSpeaking();
  choicesBox.innerHTML = '';
  step.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.innerHTML = opt.text + (opt.tag ? `<span class="tag">${opt.tag}</span>` : '');
    b.addEventListener('click', () => {
      sfxChoice();
      applyEffects(opt.effects);
      choicesBox.classList.remove('show');
      if(opt.then && opt.then.length){ script.splice(index + 1, 0, ...opt.then); }
      index++;
      playStep();
    });
    choicesBox.appendChild(b);
  });
  choicesBox.classList.add('show');
}

function showEnd(){
  dlgBox.classList.remove('show');
  choicesBox.classList.remove('show');
  hideAllCharacters();
  stopSpeaking();
  stopMusic();
  const es = document.getElementById('endScreen');
  document.getElementById('endTitle').textContent = currentLang === 'ru' ? 'Конец главы 1' : 'End of Chapter 1';
  const statsText = currentLang === 'ru'
    ? `Твои качества:<br>🔍 Любопытство: ${stats.curiosity}<br>💪 Смелость: ${stats.courage}<br>💖 Доброта: ${stats.kindness}<br>👁 Наблюдательность: ${stats.observation}<br>🌟 Самостоятельность: ${stats.independence}<br>🎨 Творчество: ${stats.creativity}<br>🤝 Доверие: ${stats.trust}`
    : `Your traits:<br>🔍 Curiosity: ${stats.curiosity}<br>💪 Courage: ${stats.courage}<br>💖 Kindness: ${stats.kindness}<br>👁 Observation: ${stats.observation}<br>🌟 Independence: ${stats.independence}<br>🎨 Creativity: ${stats.creativity}<br>🤝 Trust: ${stats.trust}`;
  document.getElementById('endSub').innerHTML = (currentLang === 'ru'
    ? 'Ты сделал первый шаг в Тихий Свет.<br><br>'
    : 'You made the first step into the Quiet Light.<br><br>') + statsText;
  es.classList.add('show');
  sfxMagic();
}

function playStep(){
  updateDots();
  if(index >= script.length){ showEnd(); return; }
  const step = script[index];
  if(step.type === 'scene'){
    if(step.bg) setBg(step.bg);
    if(step.caption) caption(step.caption);
    if(step.music) playMusic(step.music);
    if(step.particles) startParticles(step.particles);
    if(step.magic) sfxMagic();
    index++;
    setTimeout(playStep, step.caption ? 2200 : 600);
    return;
  }
  if(step.type === 'showChar'){ if(step.magic) sfxMagic(); showCharacter(step.who, step.pos || 'center'); index++; setTimeout(playStep, 800); return; }
  if(step.type === 'hideChar'){ hideCharacter(step.who); index++; setTimeout(playStep, 600); return; }
  if(step.type === 'text'){ showText(step); return; }
  if(step.type === 'choice'){ showChoices(step); return; }
  if(step.type === 'end'){ showEnd(); return; }
}

function advance(){
  if(isTyping){
    clearInterval(typingTimer);
    dlgText.textContent = typeFullText;
    isTyping = false;
    nextArrow.classList.add('show');
    const step = script[index];
    if(step && step.text){
      if(step.narrate) speak(step.text, VoiceProfiles['']);
      else if(step.name && VoiceProfiles[step.name]) speak(step.text, VoiceProfiles[step.name]);
      else speak(step.text, VoiceProfiles['']);
    }
    return;
  }
  if(script[index] && script[index].type === 'text'){
    stopSpeaking();
    index++;
    playStep();
  }
}

document.getElementById('game').addEventListener('click', (e) => {
  if(e.target.closest('.choice-btn') || e.target.closest('.icon-btn') || e.target.closest('.loader-btn') || e.target.closest('.end-btn')) return;
  initAudio();
  if(document.getElementById('loader').classList.contains('hide')) advance();
});

/* ===== КНОПКИ ===== */
const soundBtn = document.getElementById('soundBtn');
function updateButtons(){
  soundBtn.classList.toggle('off', !soundOn);
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
}
soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  soundOn = !soundOn;
  localStorage.setItem('ts_sound', soundOn ? 'on' : 'off');
  updateButtons();
  if(!soundOn){ stopMusic(); stopSpeaking(); }
  else {
    initAudio();
    sfxClick();
    // Возобновляем музыку текущей сцены
    for(let i = index; i >= 0; i--){
      if(script[i] && script[i].music){ playMusic(script[i].music); break; }
    }
  }
  showSoundStatus();
});
function showSoundStatus(){
  const s = document.getElementById('soundStatus');
  s.textContent = soundOn ? '🔊 Звук включён' : '🔇 Звук выключен';
  s.classList.add('show');
  setTimeout(() => s.classList.remove('show'), 1500);
}
updateButtons();

/* ===== ЯЗЫК ===== */
function applyLang(){
  document.getElementById('langBtn').textContent = '🌐 ' + currentLang.toUpperCase();
  document.getElementById('chapterLabel').textContent = currentLang === 'ru' ? 'Глава 1' : 'Chapter 1';
  document.getElementById('loaderSub').innerHTML = currentLang === 'ru'
    ? 'Некоторые двери открываются только для тех,<br>кто потерял что-то важное.'
    : 'Some doors open only for those<br>who have lost something important.';
  document.getElementById('startBtn').textContent = currentLang === 'ru' ? '🔊 Начать историю' : '🔊 Start the story';
  document.getElementById('endBtn').textContent = currentLang === 'ru' ? 'Продолжить путь' : 'Continue the journey';
}
document.getElementById('langBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  stopSpeaking();
  currentLang = currentLang === 'ru' ? 'en' : 'ru';
  localStorage.setItem('ts_lang', currentLang);
  script = Script[currentLang];
  index = 0;
  applyLang();
  document.getElementById('endScreen').classList.remove('show');
  hideAllCharacters();
  playStep();
});

/* ===== СТАРТ ===== */
document.getElementById('startBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  // ГЛАВНОЕ: инициализация звука по прямому тапу пользователя
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  sfxClick();
  setTimeout(() => sfxMagic(), 200);
  document.getElementById('loader').classList.add('hide');
  showSoundStatus();
  setTimeout(() => { playStep(); }, 600);
});
document.getElementById('endBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  index = 0;
  document.getElementById('endScreen').classList.remove('show');
  hideAllCharacters();
  playStep();
});

/* Старт */
applyLang();
startParticles('car');
setBg('car');
window.addEventListener('beforeunload', stopMusic);
</script>
</body>
</html>
