<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VioKrista — Оживи стену</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
    touch-action: manipulation;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 80% 20%, #fff, transparent),
      radial-gradient(2px 2px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 90% 50%, #fff, transparent);
    opacity: 0.6;
    animation: twinkle 4s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 0.8; }
  }

  .title {
    font-size: clamp(20px, 6vw, 32px);
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffd93d, #ff6b6b, #a29bfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    z-index: 2;
  }

  .subtitle {
    font-size: clamp(12px, 3.5vw, 16px);
    opacity: 0.7;
    margin-bottom: 30px;
    z-index: 2;
  }

  .character-wrap {
    position: relative;
    width: min(70vw, 320px);
    height: min(70vw, 320px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
  }

  .glow {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(162, 155, 254, 0.4), transparent 70%);
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  .character {
    font-size: min(50vw, 200px);
    line-height: 1;
    transition: transform 0.15s ease;
    filter: drop-shadow(0 10px 30px rgba(162, 155, 254, 0.6));
    animation: float 3s infinite ease-in-out;
    position: relative;
    z-index: 1;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .character.jump {
    animation: jump 0.4s ease;
  }

  @keyframes jump {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-40px) scale(1.15); }
    70% { transform: translateY(0) scale(0.95); }
    100% { transform: translateY(0) scale(1); }
  }

  .speech {
    position: absolute;
    top: -10px;
    background: #fff;
    color: #1a1a2e;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: clamp(14px, 4vw, 18px);
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s ease;
    pointer-events: none;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    z-index: 3;
  }

  .speech::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #fff;
    border-bottom: 0;
  }

  .speech.show {
    opacity: 1;
    transform: translateY(0);
  }

  .counter {
    margin-top: 30px;
    font-size: clamp(14px, 4vw, 18px);
    opacity: 0.8;
    z-index: 2;
  }

  .counter span {
    color: #ffd93d;
    font-weight: 800;
    font-size: 1.3em;
  }

  .btn-next {
    margin-top: 40px;
    padding: 16px 40px;
    font-size: clamp(16px, 4.5vw, 20px);
    font-weight: 700;
    border: none;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d);
    color: #1a1a2e;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
    transition: transform 0.15s ease;
    z-index: 2;
  }

  .btn-next:active {
    transform: scale(0.95);
  }

  .btn-next:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .hint {
    margin-top: 20px;
    font-size: clamp(11px, 3vw, 14px);
    opacity: 0.5;
    text-align: center;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="stars"></div>

  <h1 class="title">VioKrista</h1>
  <p class="subtitle">Оживи стену ✨</p>

  <div class="character-wrap" id="characterWrap">
    <div class="glow"></div>
    <div class="speech" id="speech"></div>
    <div class="character" id="character">🐉</div>
  </div>

  <div class="counter">Ты разбудил меня <span id="count">0</span> раз!</div>

  <button class="btn-next" id="btnNext" disabled>Дальше →</button>

  <p class="hint">Нажимай на персонажа пальцем 👆</p>

<script>
  const character = document.getElementById('character');
  const speech = document.getElementById('speech');
  const countEl = document.getElementById('count');
  const btnNext = document.getElementById('btnNext');
  const characterWrap = document.getElementById('characterWrap');

  const phrases = [
    'Привет! Я Vio! 👋',
    'Щекотно! 😄',
    'Давай играть! 🎮',
    'Ты меня нашёл! 🌟',
    'Ура! 🎉',
    'Ещё раз! 🔁',
    'Как тебя зовут? 💫',
    'Я живу на стене! 🧱',
    'Ты мой друг! ❤️',
    'Погладь ещё! ✋'
  ];

  const emotions = ['🐉', '😄', '😲', '🥳', '😊', '🤩', '😎', '🐲'];

  let count = 0;
  let lastPhrase = -1;
  let lastEmotion = -1;

  function randomDifferent(arr, lastIndex) {
    let i;
    do {
      i = Math.floor(Math.random() * arr.length);
    } while (i === lastIndex && arr.length > 1);
    return i;
  }

  function react() {
    count++;
    countEl.textContent = count;

    // Прыжок
    character.classList.remove('jump');
    void character.offsetWidth;
    character.classList.add('jump');

    // Смена эмоции
    const eIdx = randomDifferent(emotions, lastEmotion);
    lastEmotion = eIdx;
    setTimeout(() => {
      character.textContent = emotions[eIdx];
    }, 200);

    // Фраза
    const pIdx = randomDifferent(phrases, lastPhrase);
    lastPhrase = pIdx;
    speech.textContent = phrases[pIdx];
    speech.classList.add('show');

    clearTimeout(window.speechTimer);
    window.speechTimer = setTimeout(() => {
      speech.classList.remove('show');
    }, 1500);

    // Вибрация (если поддерживается)
    if (navigator.vibrate) {
      navigator.vibrate(30);
    }

    // Активация кнопки после 5 касаний
    if (count >= 5) {
      btnNext.disabled = false;
    }
  }

  characterWrap.addEventListener('click', react);
  characterWrap.addEventListener('touchstart', (e) => {
    e.preventDefault();
    react();
  }, { passive: false });

  btnNext.addEventListener('click', () => {
    alert('🎨 Скоро тут будет раскраска!\n\nА потом — история про VioKrista.\n\nСпасибо, что играешь! ❤️');
  });
</script>
</body>
</html>
